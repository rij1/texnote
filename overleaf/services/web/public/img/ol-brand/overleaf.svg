<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 36" width="146" height="36">
  <defs>
    <!-- Crisp High-Contrast Gradient for Light Theme -->
    <linearGradient id="texGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="orbitGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(2, 2)">
    <!-- Document Shield with rounded corner and folded tab -->
    <path d="M 5 3 C 5 1.5 6.5 0 8 0 L 21 0 C 22 0 23 1 23.8 1.8 L 28.2 6.2 C 29 7 29 8 29 9 L 29 26 C 29 27.5 27.5 29 26 29 L 8 29 C 6.5 29 5 27.5 5 26 Z" 
          fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Folded tab -->
    <path d="M 21 0 L 21 7 L 28 7 Z" fill="#0284c7" opacity="0.3" />
    
    <!-- Bold 'T' Monogram in Shield -->
    <path d="M 10 9.5 L 24 9.5 M 17 9.5 L 17 22" 
          stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Planetary Orbit Ring -->
    <ellipse cx="17" cy="16" rx="15" ry="5.8" transform="rotate(-28 17 16)"
             fill="none" stroke="url(#orbitGradLight)" stroke-width="1.8" stroke-dasharray="34 7" stroke-linecap="round" />
    <!-- Orbiting Satellite Spark -->
    <circle cx="28" cy="8.5" r="1.8" fill="#0284c7" />
  </g>

  <!-- Typography: Deep Slate 'TeX' + Royal Teal 'Note' -->
  <text x="39" y="25.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="22" font-weight="800" letter-spacing="-0.3">
    <tspan fill="#0f172a">TeX</tspan><tspan fill="url(#texGradLight)">Note</tspan>
  </text>
</svg>